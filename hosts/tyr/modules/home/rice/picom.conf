# tyr — picom: rounded corners, neon glow, glass and animations.
#
# Symlinked to ~/.config/picom/picom.conf. tyr has no GPU, so everything here
# is drawn on the CPU and sent over RDP. That is why the backend is xrender:
# measured on 4 cores at 1080p with a terminal scrolling flat out, xrender
# costs about 70% of one core, the glx backend about 260%. Idle it is ~4%.
#
#   Mod+Shift+P   effects on/off
#   Mod+Ctrl+P    same, plus real frosted-glass blur on the glx backend (heavy)
#
# After editing this file, press Mod+Shift+P twice to reload it.

backend = "xrender";
vsync = false;            # an RDP session has no display to sync to
# Full repaints: with damage tracking on, xrender stops drawing windows after an
# override-redirect window (rofi, dmenu) has been shown. Costs CPU, stays correct.
use-damage = false;
detect-client-opacity = true;

# ── rounded corners ─────────────────────────────────────────────────────────
corner-radius = 14;

# ── neon glow (a centred, coloured shadow) ──────────────────────────────────
# Cyan by default; the focused window is switched to pink in the rules below.
shadow = true;
shadow-radius = 26;
shadow-offset-x = -26;
shadow-offset-y = -26;
shadow-opacity = 0.7;
shadow-color = "#2de2e6";

# ── fades ───────────────────────────────────────────────────────────────────
fading = true;
fade-in-step = 0.1;
fade-out-step = 0.1;
fade-delta = 8;

# ── per-window rules (later rules win) ──────────────────────────────────────
rules = (
  # the window you are working in glows pink
  { match = "focused"; shadow-color = "#ff4fa3"; },

  # everything else steps back
  { match = "!focused"; opacity = 0.95; dim = 0.08; },

  # the bar (oxwm's bar is override-redirect with no class or window type):
  # square and glassy, with a pink underlight
  { match = "override_redirect && !class_g";
    corner-radius = 0; opacity = 0.86; dim = 0; shadow-color = "#ff4fa3"; },

  # menus and tooltips: no glow, no fade-back
  { match = "window_type = 'tooltip' || window_type = 'menu' || window_type = 'popup_menu' || window_type = 'dropdown_menu'";
    shadow = false; opacity = 1; dim = 0; },

  # the launcher keeps its own rounded border
  { match = "class_g = 'Rofi'"; opacity = 1; dim = 0; shadow-color = "#ff4fa3"; },

  # fullscreen is left alone
  { match = "fullscreen"; corner-radius = 0; shadow = false; opacity = 1; dim = 0; },

  # screenshot selection must not be shadowed or dimmed
  { match = "class_g = 'slop' || class_g = 'maim'";
    shadow = false; blur-background = false; opacity = 1; dim = 0; }
);

# ── animations ──────────────────────────────────────────────────────────────
animations = (
  { triggers = [ "open", "show" ];  preset = "appear";    duration = 0.16; scale = 0.94; },
  { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.12; scale = 0.94; },
  { triggers = [ "geometry" ];      preset = "geometry-change"; duration = 0.16; }
);
